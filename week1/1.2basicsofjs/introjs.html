function canVote(age){

}

function isEvenOdd(num){
    if(num % 2 == 0){
        console.log("Even");
    }else{
        console.log("Odd");
    }
}

function sum(num){
    let sum = 0;

    for(let i = 1; i<=num;i++){
        sum += i;
    }
    return sum;
}

function summ(num){
    let sum = 0;
    let i = 1;
    while ( i<= num){
        sum += i;
        i++;
    }
    console.log(sum);
}
function greet(name){

}
