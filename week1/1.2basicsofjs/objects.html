//Write a function that takes an array of numbers as input, 
// and returns a new array with only even values. Read about filter in JS
  function even(numbers) {
    const even = numbers.filter(num => num % 2 === 0);
    console.log("Even numbers:", even);
  } 

  let numbers = [1, 2, 3, 4, 5, 6];
    even(numbers);

    function morethan18(users){

//Create a function that takes an array of objects as input,

    function maleUsers(users) {
        const ans = users.filter(user => user.age > 18 && user.gender === "male");

//solving by creating a new array 
    function male2(users){
